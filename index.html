<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'">
<title>文件预览</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    a[href^="https://htmlhoster.com/?ref="] { display: none !important; }
    div:has(> a[href^="https://htmlhoster.com/?ref="]) { display: none !important; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
        font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        background: #ffffff;
        min-height: 100vh;
        padding: 20px 12px;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 12px 4px; }
    h1 { font-size: 22px; color: #1e293b; text-align: center; margin-bottom: 12px; word-break: break-all; }
    .text-content { font-size: 15px; line-height: 1.8; color: #334155; margin-bottom: 14px; white-space: normal; }
    .meta { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 12px; }
    .preview-wrap {
        border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; background: #f8fafc;
        margin-bottom: 12px;
    }
    iframe.preview { width: 100%; height: 78vh; min-height: 420px; border: 0; display: block; }
    .dl-row { text-align: center; margin: 10px 0 4px; }
    .tip {
        background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8;
        border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 12px;
    }
    .tip b { color: #1e40af; }
</style>

</head>
<body>
    <div class="container">
        <h1>文件预览</h1>
        
        <div class="meta">HowToLiveBetter.pdf · 8.2 MB · 在线预览（原始文件）</div>
        <div class="preview-wrap"><iframe class="preview" src="./HowToLiveBetter.pdf" title="HowToLiveBetter.pdf"></iframe></div>
        <div class="dl-row">
            <a href="./HowToLiveBetter.pdf" download="HowToLiveBetter.pdf"
               style="display:inline-block;background:#2563eb;color:#fff;text-decoration:none;font-size:15px;font-weight:600;padding:11px 26px;border-radius:8px;">
               &#11015; 下载源文件</a>
        </div>
        <div class="tip">&#128230; 页面内已直接显示<b>原始 PDF 内容</b>（100% 清晰度，不压缩不转换）；如需保存原文件，点击上方「下载源文件」按钮即可下载。</div>
    </div>
</body>
</html>
